name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests are only built, to catch a broken page before it is merged.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The full history: page dates and authors come from git.
          fetch-depth: 0
      - uses: withastro/action@v4
        with:
          package-manager: bun@latest
          # Astro 7 needs a newer Node than the action's default 22.x.
          node-version: 24

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
